server {
    listen 80;
    server_name _;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Dashboard SPA (React)
    location /bug-reporter/ {
        alias /usr/share/nginx/html/bug-reporter/;
        try_files $uri $uri/ /bug-reporter/dashboard.html;
    }

    # Widget JS — allow cross-origin loading
    location = /bug-reporter/widget.js {
        alias /usr/share/nginx/html/bug-reporter/widget.js;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static assets caching
    location ~* /bug-reporter/assets/.*\.(js|css|png|jpg|svg|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Redirect root to /bug-reporter/
    location = / {
        return 301 /bug-reporter/;
    }
}
