server {
    listen 80;
    server_name _;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Dashboard SPA (React)
    location /errora/ {
        alias /usr/share/nginx/html/errora/;
        index dashboard.html;
        try_files $uri $uri/ /errora/dashboard.html;
    }

    # Widget JS — allow cross-origin loading
    location = /errora/errora-widget.iife.js {
        alias /usr/share/nginx/html/errora/errora-widget.iife.js;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static assets caching
    location ~* /errora/assets/.*\.(js|css|png|jpg|svg|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Redirect root to /errora/
    location = / {
        return 301 /errora/;
    }
}
