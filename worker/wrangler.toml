name = "errora-api"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "*"
NOTION_REDIRECT_URI = "https://errora-api.kotoshkadev.workers.dev/api/notion/callback"
DASHBOARD_URL = "https://errora.net"

# ── Secrets (set via `wrangler secret put <NAME>`) ──
# Supabase + Notion OAuth credentials.
# Client-specific TG/Notion tokens are stored in the `clients` DB table.
#
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_KEY
#   wrangler secret put NOTION_CLIENT_ID
#   wrangler secret put NOTION_CLIENT_SECRET
