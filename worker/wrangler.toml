name = "errora-api"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "*"

# ── Secrets (set via `wrangler secret put <NAME>`) ──
# Only Supabase credentials are needed now.
# Client-specific TG/Notion tokens are stored in the `clients` DB table.
#
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_KEY
